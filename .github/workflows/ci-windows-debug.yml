name: CI Windows debug
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: as-daemon ensure test
        shell: bash
        timeout-minutes: 5
        run: cargo test -p as-daemon --test daemon ensure_daemon -- --nocapture
