name: CI Windows debug
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: diag
        shell: bash
        run: cargo test -p as-core pty_diag -- --nocapture --test-threads=1
        continue-on-error: true
        timeout-minutes: 5
      - name: tests
        shell: bash
        run: cargo test --workspace --no-fail-fast -- --nocapture 2>&1 | tail -n 400
