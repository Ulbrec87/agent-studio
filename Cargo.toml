[package]
name = "agent-studio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Orchestrate Claude Code, Codex and OpenCode agents in parallel from your terminal"
repository.workspace = true

[[bin]]
name = "agent-studio"
path = "src/main.rs"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/kawashita86/agent-studio"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
as-core = { version = "0.1.0", path = "crates/as-core" }
as-daemon = { version = "0.1.0", path = "crates/as-daemon" }
as-proto = { version = "0.1.0", path = "crates/as-proto" }
as-tui = { version = "0.1.0", path = "crates/as-tui" }
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
